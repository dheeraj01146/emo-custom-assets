name: Generate EMO GIFs for Xiaozhi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate All Expression GIFs
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          os.makedirs("gifs", exist_ok=True)
          W, H = 240, 240   # Square display standard for Xiaozhi GIF assets
          CYAN = (0, 240, 255)
          BG = (0, 0, 0)
          GAP = 28

          def draw_eye(draw, lx, rx, cy, ew, eh, r=16, dot=True, dot_ox=0, dot_oy=0):
              ty = cy - eh // 2
              draw.rounded_rectangle([lx, ty, lx + ew, ty + eh], radius=r, fill=CYAN)
              draw.rounded_rectangle([rx, ty, rx + ew, ty + eh], radius=r, fill=CYAN)
              if dot and eh > 15:
                  dot_r = 6
                  lc = (lx + ew // 2 + dot_ox, cy + dot_oy)
                  rc = (rx + ew // 2 + dot_ox, cy + dot_oy)
                  draw.ellipse([lc[0] - dot_r, lc[1] - dot_r, lc[0] + dot_r, lc[1] + dot_r], fill=BG)
                  draw.ellipse([rc[0] - dot_r, rc[1] - dot_r, rc[0] + dot_r, rc[1] + dot_r], fill=BG)

          def draw_mouth(draw, open_h, width=46, cy=180):
              if open_h <= 0: return
              lx = W // 2 - width // 2
              rx = W // 2 + width // 2
              draw.rounded_rectangle([lx, cy - open_h // 2, rx, cy + open_h // 2], radius=open_h // 2, fill=CYAN)

          # Helper to save GIF
          def save_gif(name, frames, duration=150):
              frames[0].save(f"gifs/{name}.gif", save_all=True, append_images=frames[1:], duration=duration, loop=0)

          # 1. Neutral (Idle breathing)
          f_neutral = []
          for eh in [66, 68, 66, 64]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              ew = 50
              lx = W // 2 - GAP // 2 - ew
              rx = W // 2 + GAP // 2
              draw_eye(d, lx, rx, H // 2 - 10, ew, eh)
              f_neutral.append(img)
          save_gif("neutral", f_neutral, 200)

          # 2. Blink
          f_blink = []
          for eh in [66, 40, 14, 4, 30, 66]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              ew = 50
              lx = W // 2 - GAP // 2 - ew
              rx = W // 2 + GAP // 2
              draw_eye(d, lx, rx, H // 2 - 10, ew, eh, dot=(eh > 20))
              f_blink.append(img)
          save_gif("blink", f_blink, 80)

          # 3. Speaking / Talking (Eyes + Animated Mouth)
          f_speak = []
          for mh in [6, 16, 24, 18, 10, 4]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              ew, eh = 50, 64
              lx = W // 2 - GAP // 2 - ew
              rx = W // 2 + GAP // 2
              draw_eye(d, lx, rx, H // 2 - 18, ew, eh)
              draw_mouth(d, open_h=mh, width=50, cy=176)
              f_speak.append(img)
          save_gif("speak", f_speak, 120)

          # 4. Happy
          f_happy = []
          for i, mh in enumerate([8, 18, 12]):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              ew, eh = 50, 52
              lx = W // 2 - GAP // 2 - ew
              rx = W // 2 + GAP // 2
              # Curved upper eyes
              for x in [lx, rx]:
                  d.pieslice([x, H // 2 - 40, x + ew, H // 2 + 10], 180, 360, fill=CYAN)
              draw_mouth(d, open_h=mh, width=42, cy=168)
              f_happy.append(img)
          save_gif("happy", f_happy, 160)

          # 5. Sad
          f_sad = []
          for dy in [0, 2, 4, 2]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              ew, eh = 48, 54
              lx = W // 2 - GAP // 2 - ew
              rx = W // 2 + GAP // 2
              draw_eye(d, lx, rx, H // 2 + 6 + dy, ew, eh, dot_oy=8)
              f_sad.append(img)
          save_gif("sad", f_sad, 220)

          # 6. Listen (Looking side dhyan se)
          f_listen = []
          for ox in [-12, -16, -12, 0, 12, 16, 12, 0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              ew, eh = 50, 64
              lx = W // 2 - GAP // 2 - ew + ox
              rx = W // 2 + GAP // 2 + ox
              draw_eye(d, lx, rx, H // 2 - 10, ew, eh, dot_ox=ox//3)
              f_listen.append(img)
          save_gif("listen", f_listen, 140)

          # 7. Think (Looking up)
          f_think = []
          for oy in [-12, -16, -12]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              ew, eh = 46, 56
              lx = W // 2 - GAP // 2 - ew + 4
              rx = W // 2 + GAP // 2 + 4
              draw_eye(d, lx, rx, H // 2 - 10 + oy, ew, eh, dot_oy=-6)
              f_think.append(img)
          save_gif("think", f_think, 200)

          # 8. Wake (Active pop)
          f_wake = []
          for eh in [30, 74, 68]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              ew = 54
              lx = W // 2 - GAP // 2 - ew
              rx = W // 2 + GAP // 2
              draw_eye(d, lx, rx, H // 2 - 12, ew, eh)
              f_wake.append(img)
          save_gif("wake", f_wake, 110)

          print("Generated animated GIFs for Xiaozhi builder!")
          EOF

      - name: Commit GIFs To Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gifs/
          git commit -m "Add animated EMO GIFs (Cyan with Pupils & Mouth)" || echo "No changes"
          git push

      - name: Upload GIFs as ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emo-gifs
          path: gifs/
