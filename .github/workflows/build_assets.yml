name: Generate Xiaozhi Official EMO GIFs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate Exact 21 Xiaozhi GIFs
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          os.makedirs("gifs", exist_ok=True)
          W, H = 320, 320
          BG = (0, 0, 0)
          WHITE = (255, 255, 255)
          GAP = 40
          EYE_R = 45

          def draw_round_eyes(draw, cy, radius, dot=True, dot_ox=0, dot_oy=0, blink_scale=1.0):
              lx = W // 2 - GAP // 2 - radius
              rx = W // 2 + GAP // 2 + radius
              eh = int(radius * blink_scale)
              
              draw.ellipse([lx - radius, cy - eh, lx + radius, cy + eh], fill=WHITE)
              draw.ellipse([rx - radius, cy - eh, rx + radius, cy + eh], fill=WHITE)

              if dot and blink_scale > 0.35:
                  dot_r = int(12 * blink_scale)
                  draw.ellipse([lx + dot_ox - dot_r, cy + dot_oy - dot_r,
                                lx + dot_ox + dot_r, cy + dot_oy + dot_r], fill=BG)
                  draw.ellipse([rx + dot_ox - dot_r, cy + dot_oy - dot_r,
                                rx + dot_ox + dot_r, cy + dot_oy + dot_r], fill=BG)

          def draw_mouth(draw, open_h, width=64, cy=245):
              if open_h <= 0: return
              lx = W // 2 - width // 2
              rx = W // 2 + width // 2
              draw.rounded_rectangle([lx, cy - open_h // 2, rx, cy + open_h // 2], radius=open_h // 2, fill=WHITE)

          def save_gif(name, frames, duration=150):
              frames[0].save(f"gifs/{name}.gif", save_all=True, append_images=frames[1:], duration=duration, loop=0)

          # 1. Neutral (Idle / Breathing)
          f_neutral = []
          for dr in [0, 2, 0, -2]:
              img = Image.new("RGB", (W, H), BG)
              draw_round_eyes(ImageDraw.Draw(img), H // 2 - 15, EYE_R + dr)
              f_neutral.append(img)
          save_gif("neutral", f_neutral, 220)

          # 2. Happy (Curved happy eyes + mouth)
          f_happy = []
          for mh in [8, 22, 14]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              lx = W // 2 - GAP // 2 - EYE_R
              rx = W // 2 + GAP // 2 + EYE_R
              for cx in [lx, rx]:
                  d.pieslice([cx - EYE_R, H // 2 - 55, cx + EYE_R, H // 2 + 25], 180, 360, fill=WHITE)
              draw_mouth(d, open_h=mh, width=60, cy=235)
              f_happy.append(img)
          save_gif("happy", f_happy, 160)

          # 3. Laughing
          f_laughing = []
          for mh in [16, 32, 22]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              lx = W // 2 - GAP // 2 - EYE_R
              rx = W // 2 + GAP // 2 + EYE_R
              for cx in [lx, rx]:
                  d.pieslice([cx - EYE_R, H // 2 - 50, cx + EYE_R, H // 2 + 20], 180, 360, fill=WHITE)
              draw_mouth(d, open_h=mh, width=72, cy=235)
              f_laughing.append(img)
          save_gif("laughing", f_laughing, 120)

          # 4. Funny
          f_funny = []
          for i, ox in enumerate([8, -8, 8]):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 15, EYE_R, dot_ox=ox)
              draw_mouth(d, open_h=18, width=54, cy=240)
              f_funny.append(img)
          save_gif("funny", f_funny, 150)

          # 5. Sad
          f_sad = []
          for dy in [0, 4, 2]:
              img = Image.new("RGB", (W, H), BG)
              draw_round_eyes(ImageDraw.Draw(img), H // 2 + dy, EYE_R - 4, dot_oy=14)
              f_sad.append(img)
          save_gif("sad", f_sad, 220)

          # 6. Angry
          f_angry = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 10, EYE_R, dot_oy=4)
              d.polygon([(0, 0), (W // 2, 115), (0, 115)], fill=BG)
              d.polygon([(W, 0), (W // 2, 115), (W, 115)], fill=BG)
              f_angry.append(img)
          save_gif("angry", f_angry, 180)

          # 7. Crying
          f_crying = []
          for sc in [0.9, 0.85, 0.9]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 + 5, int(EYE_R * sc), dot_oy=10)
              # Tear lines
              d.line([(W//2 - 60, 200), (W//2 - 60, 250)], fill=WHITE, width=4)
              d.line([(W//2 + 60, 200), (W//2 + 60, 250)], fill=WHITE, width=4)
              f_crying.append(img)
          save_gif("crying", f_crying, 160)

          # 8. Loving (Heart eyes)
          f_loving = []
          for s in [1.0, 1.15, 1.0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 15, int(EYE_R * s))
              draw_mouth(d, open_h=12, width=48, cy=240)
              f_loving.append(img)
          save_gif("loving", f_loving, 180)

          # 9. Embarrassed
          f_embarrassed = []
          for oy in [6, 10, 6]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2, EYE_R - 4, dot_oy=oy)
              # Blushing dots under eyes
              d.ellipse([70, 215, 95, 230], fill=WHITE)
              d.ellipse([225, 215, 250, 230], fill=WHITE)
              f_embarrassed.append(img)
          save_gif("embarrassed", f_embarrassed, 200)

          # 10. Surprised
          f_surprised = []
          for s in [1.15, 1.25, 1.15]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 20, int(EYE_R * s))
              draw_mouth(d, open_h=34, width=34, cy=245)
              f_surprised.append(img)
          save_gif("surprised", f_surprised, 150)

          # 11. Shocked
          f_shocked = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 25, EYE_R + 10, dot_oy=-4)
              draw_mouth(d, open_h=44, width=44, cy=245)
              f_shocked.append(img)
          save_gif("shocked", f_shocked, 140)

          # 12. Thinking (Looking up)
          f_thinking = []
          for oy in [-12, -18, -12]:
              img = Image.new("RGB", (W, H), BG)
              draw_round_eyes(ImageDraw.Draw(img), H // 2 - 15, EYE_R - 2, dot_oy=oy)
              f_thinking.append(img)
          save_gif("thinking", f_thinking, 200)

          # 13. Winking
          f_winking = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              lx = W // 2 - GAP // 2 - EYE_R
              rx = W // 2 + GAP // 2 + EYE_R
              cy = H // 2 - 15
              d.ellipse([lx - EYE_R, cy - EYE_R, lx + EYE_R, cy + EYE_R], fill=WHITE)
              d.ellipse([lx - 12, cy - 12, lx + 12, cy + 12], fill=BG)
              d.ellipse([rx - EYE_R, cy - 4, rx + EYE_R, cy + 4], fill=WHITE)
              f_winking.append(img)
          save_gif("winking", f_winking, 220)

          # 14. Cool
          f_cool = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              # Sunglasses cut look
              draw_round_eyes(d, H // 2 - 10, EYE_R)
              d.rectangle([40, 110, 280, 145], fill=BG)
              draw_mouth(d, open_h=8, width=50, cy=240)
              f_cool.append(img)
          save_gif("cool", f_cool, 200)

          # 15. Relaxed
          f_relaxed = []
          for sc in [0.4, 0.45, 0.4]:
              img = Image.new("RGB", (W, H), BG)
              draw_round_eyes(ImageDraw.Draw(img), H // 2, EYE_R, dot=False, blink_scale=sc)
              f_relaxed.append(img)
          save_gif("relaxed", f_relaxed, 250)

          # 16. Delicious
          f_delicious = []
          for mh in [10, 18, 12]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 15, EYE_R)
              draw_mouth(d, open_h=mh, width=46, cy=235)
              f_delicious.append(img)
          save_gif("delicious", f_delicious, 160)

          # 17. Kisses
          f_kisses = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 15, EYE_R, blink_scale=0.35, dot=False)
              draw_mouth(d, open_h=14, width=16, cy=235)
              f_kisses.append(img)
          save_gif("kisses", f_kisses, 180)

          # 18. Confident
          f_confident = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 12, EYE_R, blink_scale=0.8)
              draw_mouth(d, open_h=10, width=52, cy=235)
              f_confident.append(img)
          save_gif("confident", f_confident, 180)

          # 19. Sleepy
          f_sleepy = []
          for sc in [0.1, 0.15, 0.1]:
              img = Image.new("RGB", (W, H), BG)
              draw_round_eyes(ImageDraw.Draw(img), H // 2 + 10, EYE_R, dot=False, blink_scale=sc)
              f_sleepy.append(img)
          save_gif("sleepy", f_sleepy, 300)

          # 20. Silly
          f_silly = []
          for ox in [-14, 14, -14]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_round_eyes(d, H // 2 - 15, EYE_R, dot_ox=ox)
              draw_mouth(d, open_h=16, width=40, cy=240)
              f_silly.append(img)
          save_gif("silly", f_silly, 160)

          # 21. Confused
          f_confused = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              lx = W // 2 - GAP // 2 - EYE_R
              rx = W // 2 + GAP // 2 + EYE_R
              # One big eye, one smaller squinting eye
              d.ellipse([lx - EYE_R, H//2 - 15 - EYE_R, lx + EYE_R, H//2 - 15 + EYE_R], fill=WHITE)
              d.ellipse([lx - 12, H//2 - 27, lx + 12, H//2 - 3], fill=BG)
              d.ellipse([rx - (EYE_R-12), H//2 - 10 - (EYE_R-12), rx + (EYE_R-12), H//2 - 10 + (EYE_R-12)], fill=WHITE)
              d.ellipse([rx - 8, H//2 - 18, rx + 8, H//2 - 2], fill=BG)
              f_confused.append(img)
          save_gif("confused", f_confused, 200)

          print("Generated all 21 exact Xiaozhi named GIFs successfully!")
          EOF

      - name: Commit GIFs To Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gifs/
          git commit -m "Generated exact 21 Xiaozhi GIFs (White Round Eyes + Center Pupils)" || echo "No changes"
          git push

      - name: Upload GIFs ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-21-emojis
          path: gifs/
