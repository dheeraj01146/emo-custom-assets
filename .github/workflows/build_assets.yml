name: Generate Ultra Cute Expressive EMO GIFs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate Perfect EMO GIFs with Real Eyelids
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          os.makedirs("gifs", exist_ok=True)
          W, H = 320, 320
          BG = (0, 0, 0)
          WHITE = (255, 255, 255)
          RED = (255, 50, 75)
          GAP = 46
          R = 46
          PR = 11

          lx = W // 2 - GAP // 2 - R
          rx = W // 2 + GAP // 2 + R
          cy = H // 2 - 10

          def draw_eye_with_eyelid(draw, cx, cy, r=R, ox=0, oy=0, lid_cover=0.0):
              # 1. Full Solid Round White Eye
              draw.ellipse([cx - r, cy - r, cx + r, cy + r], fill=WHITE)
              
              # 2. Black Center Pupil
              draw.ellipse([cx + ox - PR, cy + oy - PR, cx + ox + PR, cy + oy + PR], fill=BG)
              
              # 3. Real Eyelid (Palak upar se niche aakar cover karti hai)
              if lid_cover > 0.0:
                  cover_y = (cy - r) + int(2 * r * lid_cover)
                  draw.rectangle([cx - r - 4, cy - r - 6, cx + r + 4, cover_y], fill=BG)
                  # Eyelid border line for clean anime curve
                  if lid_cover < 0.98:
                      draw.line([(cx - r, cover_y), (cx + r, cover_y)], fill=BG, width=2)

          def draw_mc_heart(draw, hx, cur_y):
              draw.rectangle([hx - 10, cur_y - 8, hx - 3, cur_y], fill=RED)
              draw.rectangle([hx + 3, cur_y - 8, hx + 10, cur_y], fill=RED)
              draw.rectangle([hx - 14, cur_y, hx + 14, cur_y + 8], fill=RED)
              draw.rectangle([hx - 10, cur_y + 8, hx + 10, cur_y + 14], fill=RED)
              draw.rectangle([hx - 5, cur_y + 14, hx + 5, cur_y + 18], fill=RED)

          def save_gif(name, frames, duration=150):
              frames[0].save(f"gifs/{name}.gif", save_all=True, append_images=frames[1:], duration=duration, loop=0)

          # 1. NEUTRAL (Real Eyelid Blink + Living Idle Routines)
          f_neutral = []
          # Palak upar se niche aane wali smooth blink
          for lid in [0.0, 0.0, 0.35, 0.75, 1.0, 0.5, 0.0, 0.0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, lid_cover=lid)
              draw_eye_with_eyelid(d, rx, cy, lid_cover=lid)
              f_neutral.append(img)

          # Tea sipping
          for st in [0, 1, 2, 1]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, lid_cover=0.2)
              draw_eye_with_eyelid(d, rx, cy, lid_cover=0.2)
              d.ellipse([W//2 - 6, 216, W//2 + 6, 226], fill=WHITE)
              d.rounded_rectangle([W//2 - 16, 234, W//2 + 16, 258], radius=5, fill=WHITE)
              d.arc([W//2 + 12, 238, W//2 + 22, 252], -90, 90, fill=WHITE, width=2)
              d.line([(W//2 - 4, 228 - st*2), (W//2 - 3, 222 - st*2)], fill=WHITE, width=2)
              f_neutral.append(img)

          # Burger bite
          for by in [240, 232, 236, 242]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, oy=2)
              draw_eye_with_eyelid(d, rx, cy, oy=2)
              d.rounded_rectangle([W//2 - 20, by, W//2 + 20, by + 14], radius=6, fill=WHITE)
              d.line([(W//2 - 18, by + 7), (W//2 + 18, by + 7)], fill=BG, width=2)
              f_neutral.append(img)

          # Knitting sweater
          for kx in [-6, 6, -6, 6]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, oy=4, lid_cover=0.15)
              draw_eye_with_eyelid(d, rx, cy, oy=4, lid_cover=0.15)
              d.ellipse([W//2 - 14, 230, W//2 + 14, 258], fill=WHITE)
              d.line([(W//2 - 26 + kx, 222), (W//2 + 8, 256)], fill=WHITE, width=3)
              d.line([(W//2 + 26 - kx, 222), (W//2 - 8, 256)], fill=WHITE, width=3)
              f_neutral.append(img)
          save_gif("neutral", f_neutral, 160)

          # 2. HAPPY
          f_happy = []
          for dy in [0, -4, -6, -2]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              for cx in [lx, rx]:
                  d.pieslice([cx - R, cy - R + dy, cx + R, cy + R + dy], 180, 360, fill=WHITE)
                  d.pieslice([cx - R, cy - R + 14 + dy, cx + R, cy + R + 14 + dy], 180, 360, fill=BG)
              d.rounded_rectangle([W//2 - 20, 230 + dy, W//2 + 20, 244 + dy], radius=7, fill=WHITE)
              f_happy.append(img)
          save_gif("happy", f_happy, 150)

          # 3. LAUGHING
          f_laugh = []
          for h in [14, 24, 32, 22]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              for cx in [lx, rx]:
                  d.pieslice([cx - R, cy - R - 6, cx + R, cy + R - 6], 180, 360, fill=WHITE)
                  d.pieslice([cx - R, cy - R + 12, cx + R, cy + R + 12], 180, 360, fill=BG)
              d.pieslice([W//2 - 26, 216, W//2 + 26, 216 + h*2], 0, 180, fill=WHITE)
              f_laugh.append(img)
          save_gif("laughing", f_laugh, 120)

          # 4. FUNNY
          f_funny = []
          for dy, mh in [(0, 14), (-4, 24), (-2, 28), (0, 18)]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy + dy, lid_cover=0.25)
              draw_eye_with_eyelid(d, rx, cy + dy, lid_cover=0.25)
              d.pieslice([W//2 - 24, 220 + dy, W//2 + 24, 220 + dy + mh*2], 0, 180, fill=WHITE)
              f_funny.append(img)
          save_gif("funny", f_funny, 140)

          # 5. SAD (Droopy eyelid covering upper half)
          f_sad = []
          for lid in [0.4, 0.4, 0.7, 1.0, 0.6, 0.4]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy + 10, oy=10, lid_cover=lid)
              draw_eye_with_eyelid(d, rx, cy + 10, oy=10, lid_cover=lid)
              d.arc([W//2 - 16, 235, W//2 + 16, 255], 180, 360, fill=WHITE, width=4)
              f_sad.append(img)
          save_gif("sad", f_sad, 180)

          # 6. ANGRY (Flames from sides + Slanted eyelids)
          f_angry = []
          for fl in [0, 8, 14, 6]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, oy=4)
              draw_eye_with_eyelid(d, rx, cy, oy=4)
              d.polygon([(0, 0), (W // 2, cy - 8), (0, cy - 8)], fill=BG)
              d.polygon([(W, 0), (W // 2, cy - 8), (W, cy - 8)], fill=BG)
              d.polygon([(40, cy), (15, cy - 25 - fl), (30, cy - 10), (10, cy - 40 - fl), (35, cy + 15)], fill=WHITE)
              d.polygon([(280, cy), (305, cy - 25 - fl), (290, cy - 10), (310, cy - 40 - fl), (285, cy + 15)], fill=WHITE)
              f_angry.append(img)
          save_gif("angry", f_angry, 130)

          # 7. CRYING
          f_crying = []
          for ty in [5, 20, 38, 56]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy + 10, oy=8, lid_cover=0.35)
              draw_eye_with_eyelid(d, rx, cy + 10, oy=8, lid_cover=0.35)
              d.ellipse([lx - 5, cy + 35 + ty, lx + 5, cy + 48 + ty], fill=WHITE)
              d.ellipse([rx - 5, cy + 35 + ty, rx + 5, cy + 48 + ty], fill=WHITE)
              f_crying.append(img)
          save_gif("crying", f_crying, 130)

          # 8. LOVING (Minecraft hearts popping from sides)
          f_loving = []
          for i, hy in enumerate([0, 10, 22, 34, 46]):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy)
              draw_eye_with_eyelid(d, rx, cy)
              draw_mc_heart(d, lx - R - 10, cy - 10 - hy)
              if i >= 1:
                  draw_mc_heart(d, rx + R + 10, cy + 5 - (hy - 10))
              f_loving.append(img)
          save_gif("loving", f_loving, 150)

          # 9. EMBARRASSED
          f_embarrassed = []
          for lid in [0.25, 0.3, 0.25]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy + 6, oy=6, lid_cover=lid)
              draw_eye_with_eyelid(d, rx, cy + 6, oy=6, lid_cover=lid)
              d.ellipse([lx - 25, cy + 45, lx + 25, cy + 55], fill=WHITE)
              d.ellipse([rx - 25, cy + 45, rx + 25, cy + 55], fill=WHITE)
              f_embarrassed.append(img)
          save_gif("embarrassed", f_embarrassed, 200)

          # 10. SURPRISED (Cute paws on mouth)
          f_surprised = []
          for py in [260, 240, 230, 232]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy - 4)
              draw_eye_with_eyelid(d, rx, cy - 4)
              d.ellipse([W//2 - 12, 218, W//2 + 12, 244], fill=WHITE)
              d.rounded_rectangle([W//2 - 42, py, W//2 - 10, py + 26], radius=12, fill=WHITE)
              d.rounded_rectangle([W//2 + 10, py, W//2 + 42, py + 26], radius=12, fill=WHITE)
              f_surprised.append(img)
          save_gif("surprised", f_surprised, 140)

          # 11. SHOCKED (Clean eyelid blink)
          f_shocked = []
          for lid in [0.0, 0.0, 0.4, 0.9, 0.3, 0.0, 0.0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy - 8, lid_cover=lid)
              draw_eye_with_eyelid(d, rx, cy - 8, lid_cover=lid)
              d.ellipse([W//2 - 12, 228, W//2 + 12, 252], fill=WHITE)
              f_shocked.append(img)
          save_gif("shocked", f_shocked, 130)

          # 12. THINKING (Look up + real eyelid blink)
          f_thinking = []
          for lid in [0.0, 0.0, 0.45, 1.0, 0.4, 0.0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx + 14, cy - 14, ox=6, oy=-6, lid_cover=lid)
              draw_eye_with_eyelid(d, rx + 14, cy - 14, ox=6, oy=-6, lid_cover=lid)
              f_thinking.append(img)
          save_gif("thinking", f_thinking, 160)

          # 13. WINKING (Left open, right eyelid closes completely)
          f_wink = []
          for lid in [0.0, 0.35, 0.8, 1.0, 1.0, 0.5, 0.0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, lid_cover=0.0)
              draw_eye_with_eyelid(d, rx, cy, lid_cover=lid)
              f_wink.append(img)
          save_gif("winking", f_wink, 110)

          # 14. COOL (Sunglasses)
          f_cool = []
          for dy in [0, -2, 0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              d.rounded_rectangle([lx - R - 4, cy - 24 + dy, lx + R + 4, cy + 24 + dy], radius=8, fill=WHITE)
              d.rounded_rectangle([rx - R - 4, cy - 24 + dy, rx + R + 4, cy + 24 + dy], radius=8, fill=WHITE)
              d.rectangle([lx + R, cy - 12 + dy, rx - R, cy - 4 + dy], fill=WHITE)
              d.line([(W//2 - 16, 235 + dy), (W//2 + 16, 235 + dy)], fill=WHITE, width=4)
              f_cool.append(img)
          save_gif("cool", f_cool, 180)

          # 15. RELAXED (Chai cup sip)
          f_relaxed = []
          for steam in [0, 1, 2, 3]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              for cx in [lx, rx]:
                  d.pieslice([cx - R, cy - R + 14, cx + R, cy + R + 14], 0, 180, fill=WHITE)
                  d.pieslice([cx - R, cy - R, cx + R, cy + R], 0, 180, fill=BG)
              d.ellipse([W//2 - 7, 218, W//2 + 7, 228], fill=WHITE)
              d.rounded_rectangle([W//2 - 18, 238, W//2 + 18, 266], radius=6, fill=WHITE)
              d.arc([W//2 + 14, 244, W//2 + 26, 260], -90, 90, fill=WHITE, width=3)
              sy = 232 - steam*2
              d.line([(W//2 - 6, sy), (W//2 - 4, sy - 6)], fill=WHITE, width=2)
              d.line([(W//2 + 6, sy), (W//2 + 8, sy - 6)], fill=WHITE, width=2)
              f_relaxed.append(img)
          save_gif("relaxed", f_relaxed, 200)

          # 16. DELICIOUS (Tongue out)
          f_delicious = []
          for tw in [8, 16, 24, 28, 18]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              for cx in [lx, rx]:
                  d.pieslice([cx - R, cy - R - 2, cx + R, cy + R - 2], 180, 360, fill=WHITE)
                  d.pieslice([cx - R, cy - R + 14, cx + R, cy + R + 14], 180, 360, fill=BG)
              d.rounded_rectangle([W//2 - 24, 222, W//2 + 24, 240], radius=8, fill=WHITE)
              d.rounded_rectangle([W//2 - 9, 232, W//2 + 9, 232 + tw], radius=8, fill=RED)
              f_delicious.append(img)
          save_gif("delicious", f_delicious, 140)

          # 17. KISSES
          f_kisses = []
          for lid, hy in [(0.1, 0), (0.35, -6), (0.4, -14), (0.2, -4)]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, lid_cover=lid)
              draw_eye_with_eyelid(d, rx, cy, lid_cover=lid)
              d.ellipse([W//2 - 9, 224, W//2 + 9, 240], fill=WHITE)
              d.ellipse([W//2 - 4, 228, W//2 + 4, 236], fill=BG)
              if hy < 0:
                  d.ellipse([W//2 + 28, 205 + hy, W//2 + 40, 217 + hy], fill=RED)
              f_kisses.append(img)
          save_gif("kisses", f_kisses, 160)

          # 18. CONFIDENT (Eyelid slightly lowered + blink)
          f_confident = []
          for lid in [0.25, 0.25, 0.6, 1.0, 0.5, 0.25]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, lid_cover=lid)
              draw_eye_with_eyelid(d, rx, cy, lid_cover=lid)
              d.arc([W//2 - 16, 228, W//2 + 20, 244], 0, 160, fill=WHITE, width=4)
              f_confident.append(img)
          save_gif("confident", f_confident, 160)

          # 19. SLEEPY (Full open -> Eyelid smooth drop -> Zzz)
          f_sleepy = []
          for lid, zy in [(0.0, 0), (0.35, 0), (0.7, 0), (1.0, 4), (1.0, 12), (1.0, 20)]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy + 8, lid_cover=lid)
              draw_eye_with_eyelid(d, rx, cy + 8, lid_cover=lid)
              if lid >= 0.95:
                  d.text((rx + 20, cy - 20 - zy), "z", fill=WHITE)
                  d.text((rx + 30, cy - 35 - zy), "Z", fill=WHITE)
              f_sleepy.append(img)
          save_gif("sleepy", f_sleepy, 180)

          # 20. SILLY (Playful smirk + tongue)
          f_silly = []
          for r_diff, ty in [(-4, 8), (4, 16), (-4, 22), (0, 12)]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx, cy, r=R + r_diff, ox=4)
              draw_eye_with_eyelid(d, rx, cy, r=R - r_diff, ox=-4)
              d.arc([W//2 - 20, 220, W//2 + 20, 242], 10, 170, fill=WHITE, width=4)
              d.rounded_rectangle([W//2 + 6, 232, W//2 + 18, 232 + ty], radius=5, fill=RED)
              f_silly.append(img)
          save_gif("silly", f_silly, 140)

          # 21. CONFUSED (Head Shake: No-No)
          f_confused = []
          for hx in [0, -18, -24, 0, 18, 24, 0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_eyelid(d, lx + hx, cy, ox=-hx//3)
              draw_eye_with_eyelid(d, rx + hx, cy, ox=-hx//3)
              d.line([(W//2 - 14 + hx, 235), (W//2 + 14 + hx, 235)], fill=WHITE, width=4)
              f_confused.append(img)
          save_gif("confused", f_confused, 130)

          print("Generated 21 perfected EMO GIFs with true eyelid blink!")
          EOF

      - name: Commit GIFs To Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gifs/
          git commit -m "Implement true realistic eyelid blink covering static round eyes" || echo "No changes"
          git push

      - name: Upload GIFs ZIP
        uses: actions/upload-artifact@v4
        with:
          name: expressive-cute-emo-gifs
          path: gifs/
