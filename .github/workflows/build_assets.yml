name: Generate Images and Build Assets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pillow & LittleFS
        run: pip install pillow littlefs-python

      - name: Create EMO Frames with Center Dots and Talking Mouth
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          os.makedirs("data/emoji", exist_ok=True)
          W, H = 320, 240
          CYAN = (0, 240, 255)
          BG = (0, 0, 0)
          GAP = 36

          def draw_eye_with_dot(draw, lx, rx, ty, ew, eh, r):
              # Dono bahari Cyan aakhein
              draw.rounded_rectangle([lx, ty, lx + ew, ty + eh], radius=r, fill=CYAN)
              draw.rounded_rectangle([rx, ty, rx + ew, ty + eh], radius=r, fill=CYAN)
              
              # Center black dots (Pupils)
              dot_r = 7
              left_center = (lx + ew // 2, ty + eh // 2)
              right_center = (rx + ew // 2, ty + eh // 2)
              
              draw.ellipse([left_center[0] - dot_r, left_center[1] - dot_r,
                            left_center[0] + dot_r, left_center[1] + dot_r], fill=BG)
              draw.ellipse([right_center[0] - dot_r, right_center[1] - dot_r,
                            right_center[0] + dot_r, right_center[1] + dot_r], fill=BG)

          def draw_mouth(draw, open_h, width=54):
              # Aakhon ke theek neeche bolne wala mouth
              mouth_cy = 188
              mouth_lx = W // 2 - width // 2
              mouth_rx = W // 2 + width // 2
              mouth_ty = mouth_cy - open_h // 2
              mouth_by = mouth_cy + open_h // 2
              draw.rounded_rectangle([mouth_lx, mouth_ty, mouth_rx, mouth_by], radius=open_h // 2, fill=CYAN)

          # 1. Idle & Listening States (Aakhein + Center Dot, Bina Mouth)
          base_frames = [
              ("neutral_0", 58, 76, 18, 0, -12),
              ("neutral_1", 58, 78, 18, 0, -12),
              ("neutral_2", 58, 76, 18, 0, -12),
              ("neutral_3", 58, 74, 18, 0, -12),
              ("listen_0",  58, 74, 18, -14, -18),
              ("listen_1",  58, 74, 18, -18, -20),
              ("listen_2",  58, 74, 18, 14, -18),
              ("listen_3",  58, 74, 18, 18, -20),
              ("think_0",   50, 60, 16, 0, -22),
              ("think_1",   52, 58, 16, 6, -20),
              ("think_2",   50, 60, 16, 0, -22),
              ("think_3",   52, 58, 16, -6, -20),
          ]

          for name, ew, eh, r, ox, oy in base_frames:
              img = Image.new("RGB", (W, H), BG)
              draw = ImageDraw.Draw(img)
              cy = H // 2 + oy
              lx = (W // 2) - (GAP // 2) - ew + ox
              rx = (W // 2) + (GAP // 2) + ox
              ty = cy - eh // 2
              draw_eye_with_dot(draw, lx, rx, ty, ew, eh, r)
              img.save(f"data/emoji/{name}.png")

          # 2. Blink Frames (Aakhein band hona)
          blink_frames = [
              ("blink_0", 60, 48, 14),
              ("blink_1", 62, 20, 8),
              ("blink_2", 64, 8,  4),
              ("blink_3", 62, 38, 12),
          ]
          for name, ew, eh, r in blink_frames:
              img = Image.new("RGB", (W, H), BG)
              draw = ImageDraw.Draw(img)
              cy = H // 2 - 12
              lx = (W // 2) - (GAP // 2) - ew
              rx = (W // 2) + (GAP // 2)
              ty = cy - eh // 2
              draw.rounded_rectangle([lx, ty, lx + ew, ty + eh], radius=r, fill=CYAN)
              draw.rounded_rectangle([rx, ty, rx + ew, ty + eh], radius=r, fill=CYAN)
              img.save(f"data/emoji/{name}.png")

          # 3. Speaking / Talking Frames (Eyes with Center Dot + Animated Mouth)
          # Xiaozhi response bolte time in frames ko loop karta hai
          talk_mouth_heights = [6, 16, 26, 14, 8]
          for i, mh in enumerate(talk_mouth_heights):
              img = Image.new("RGB", (W, H), BG)
              draw = ImageDraw.Draw(img)
              # Aakhein thoda upar shift taaki mouth ke liye clear space rahe
              cy = H // 2 - 20
              ew, eh, r = 58, 76, 18
              lx = (W // 2) - (GAP // 2) - ew
              rx = (W // 2) + (GAP // 2)
              ty = cy - eh // 2
              
              draw_eye_with_dot(draw, lx, rx, ty, ew, eh, r)
              draw_mouth(draw, open_h=mh, width=56)
              
              # Happy / Speaking state map
              img.save(f"data/emoji/happy_{i}.png") if i < 3 else img.save(f"data/emoji/wake_{i-3}.png")

          print("Custom EMO frames with eye dots and talking mouth generated!")
          EOF

      - name: Commit Images To Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/emoji/
          git commit -m "Updated EMO frames: Center dot eyes + speaking mouth" || echo "No changes"
          git push

      - name: Build assets.bin
        run: |
          python - << 'EOF'
          import os
          from littlefs import LittleFS

          fs = LittleFS(block_size=4096, block_count=256)
          fs.format()
          fs.mount()

          fs.mkdir('/emoji')
          for f in sorted(os.listdir('data/emoji')):
              if f.endswith('.png'):
                  with open(f'data/emoji/{f}', 'rb') as src:
                      data = src.read()
                  with fs.open(f'/emoji/{f}', 'wb') as dst:
                      dst.write(data)

          with open('assets.bin', 'wb') as out:
              out.write(fs.context.buffer)
          print("assets.bin successfully created!")
          EOF

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: assets-bin
          path: assets.bin
