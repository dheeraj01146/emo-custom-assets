name: Generate Images and Build Assets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pillow
        run: pip install pillow

      - name: Create EMO Frames
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          os.makedirs("data/emoji", exist_ok=True)
          W, H = 320, 240
          CYAN = (0, 240, 255)
          BG = (0, 0, 0)
          GAP = 36

          def draw_eye_with_dot(draw, lx, rx, ty, ew, eh, r):
              draw.rounded_rectangle([lx, ty, lx + ew, ty + eh], radius=r, fill=CYAN)
              draw.rounded_rectangle([rx, ty, rx + ew, ty + eh], radius=r, fill=CYAN)
              dot_r = 7
              lc = (lx + ew // 2, ty + eh // 2)
              rc = (rx + ew // 2, ty + eh // 2)
              draw.ellipse([lc[0] - dot_r, lc[1] - dot_r, lc[0] + dot_r, lc[1] + dot_r], fill=BG)
              draw.ellipse([rc[0] - dot_r, rc[1] - dot_r, rc[0] + dot_r, rc[1] + dot_r], fill=BG)

          def draw_mouth(draw, open_h, width=54):
              m_cy = 188
              m_lx = W // 2 - width // 2
              m_rx = W // 2 + width // 2
              draw.rounded_rectangle([m_lx, m_cy - open_h // 2, m_rx, m_cy + open_h // 2], radius=open_h // 2, fill=CYAN)

          base_frames = [
              ("neutral_0", 58, 76, 18, 0, -12),
              ("neutral_1", 58, 78, 18, 0, -12),
              ("neutral_2", 58, 76, 18, 0, -12),
              ("neutral_3", 58, 74, 18, 0, -12),
              ("listen_0",  58, 74, 18, -14, -18),
              ("listen_1",  58, 74, 18, -18, -20),
              ("listen_2",  58, 74, 18, 14, -18),
              ("listen_3",  58, 74, 18, 18, -20),
              ("think_0",   50, 60, 16, 0, -22),
              ("think_1",   52, 58, 16, 6, -20),
              ("think_2",   50, 60, 16, 0, -22),
              ("think_3",   52, 58, 16, -6, -20),
          ]

          for name, ew, eh, r, ox, oy in base_frames:
              img = Image.new("RGB", (W, H), BG)
              draw = ImageDraw.Draw(img)
              cy = H // 2 + oy
              lx = (W // 2) - (GAP // 2) - ew + ox
              rx = (W // 2) + (GAP // 2) + ox
              draw_eye_with_dot(draw, lx, rx, cy - eh // 2, ew, eh, r)
              img.save(f"data/emoji/{name}.png")

          blink_frames = [
              ("blink_0", 60, 48, 14),
              ("blink_1", 62, 20, 8),
              ("blink_2", 64, 8,  4),
              ("blink_3", 62, 38, 12),
          ]
          for name, ew, eh, r in blink_frames:
              img = Image.new("RGB", (W, H), BG)
              draw = ImageDraw.Draw(img)
              cy = H // 2 - 12
              lx = (W // 2) - (GAP // 2) - ew
              rx = (W // 2) + (GAP // 2)
              draw.rounded_rectangle([lx, cy - eh // 2, lx + ew, cy + eh // 2], radius=r, fill=CYAN)
              draw.rounded_rectangle([rx, cy - eh // 2, rx + ew, cy + eh // 2], radius=r, fill=CYAN)
              img.save(f"data/emoji/{name}.png")

          talk_mouth_heights = [6, 16, 26, 14, 8]
          for i, mh in enumerate(talk_mouth_heights):
              img = Image.new("RGB", (W, H), BG)
              draw = ImageDraw.Draw(img)
              cy = H // 2 - 20
              ew, eh, r = 58, 76, 18
              lx = (W // 2) - (GAP // 2) - ew
              rx = (W // 2) + (GAP // 2)
              draw_eye_with_dot(draw, lx, rx, cy - eh // 2, ew, eh, r)
              draw_mouth(draw, open_h=mh, width=56)
              img.save(f"data/emoji/happy_{i}.png") if i < 3 else img.save(f"data/emoji/wake_{i-3}.png")
          EOF

      - name: Build Official SPIFFS assets.bin
        run: |
          wget https://github.com/igrr/mkspiffs/releases/download/0.2.3/mkspiffs-0.2.3-arduino-esp32-linux64.tar.gz
          tar -xzf mkspiffs-0.2.3-arduino-esp32-linux64.tar.gz
          MKBIN=$(find . -maxdepth 2 -type f -name "mkspiffs")
          chmod +x $MKBIN
          $MKBIN -c data -b 4096 -p 256 -s 0x100000 assets.bin
          ls -lh assets.bin

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: assets-bin
          path: assets.bin
