name: Generate Cute Dot-Pupil EMO GIFs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate 21 Cute Round Eyes with Center Dot GIFs
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          os.makedirs("gifs", exist_ok=True)
          W, H = 320, 320
          BG = (0, 0, 0)
          WHITE = (255, 255, 255)
          GAP = 46
          R = 48         # Outer white circle radius
          PUPIL_R = 12   # Cute center black dot radius

          def draw_eye_with_pupil(draw, cx, cy, r, pupil_ox=0, pupil_oy=0, scale_y=1.0):
              hy = max(int(r * scale_y), 4)
              # 1. White Outer Circle
              draw.ellipse([cx - r, cy - hy, cx + r, cy + hy], fill=WHITE)
              
              # 2. Center Black Dot (Pupil)
              if scale_y > 0.35:
                  pr_y = max(int(PUPIL_R * scale_y), 3)
                  px = cx + pupil_ox
                  py = cy + pupil_oy
                  draw.ellipse([px - PUPIL_R, py - pr_y, px + PUPIL_R, py + pr_y], fill=BG)

          def save_gif(name, frames, duration=150):
              frames[0].save(f"gifs/{name}.gif", save_all=True, append_images=frames[1:], duration=duration, loop=0)

          lx = W // 2 - GAP // 2 - R
          rx = W // 2 + GAP // 2 + R
          cy = H // 2

          # 1. Neutral (Idle breathing with center dots)
          f_neutral = []
          for dy in [0, -2, -4, -2, 0, 2]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy + dy, R)
              draw_eye_with_pupil(d, rx, cy + dy, R)
              f_neutral.append(img)
          save_gif("neutral", f_neutral, 180)

          # 2. Happy (Cute crescent arcs)
          f_happy = []
          for dy in [0, -4, 0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              for cx in [lx, rx]:
                  d.pieslice([cx - R, cy - R + dy, cx + R, cy + R + dy], 180, 360, fill=WHITE)
                  d.pieslice([cx - R, cy - R + 14 + dy, cx + R, cy + R + 14 + dy], 180, 360, fill=BG)
              f_happy.append(img)
          save_gif("happy", f_happy, 170)

          # 3. Laughing
          f_laugh = []
          for dy in [-2, -8, -2]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              for cx in [lx, rx]:
                  d.pieslice([cx - R - 4, cy - R + dy, cx + R + 4, cy + R + dy], 180, 360, fill=WHITE)
                  d.pieslice([cx - R - 4, cy - R + 20 + dy, cx + R + 4, cy + R + 20 + dy], 180, 360, fill=BG)
              f_laugh.append(img)
          save_gif("laughing", f_laugh, 120)

          # 4. Funny (Center dots wiggling around playfully)
          f_funny = []
          for ox, oy in [(0, 0), (-14, -8), (14, -8), (-10, 10), (10, 10)]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy, R, pupil_ox=ox, pupil_oy=oy)
              draw_eye_with_pupil(d, rx, cy, R, pupil_ox=-ox, pupil_oy=-oy)
              f_funny.append(img)
          save_gif("funny", f_funny, 140)

          # 5. Sad (Dots looking down sadly)
          f_sad = []
          for dy in [10, 14, 10]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy + dy, R - 4, pupil_oy=10, scale_y=0.85)
              draw_eye_with_pupil(d, rx, cy + dy, R - 4, pupil_oy=10, scale_y=0.85)
              f_sad.append(img)
          save_gif("sad", f_sad, 220)

          # 6. Angry (Cut angled brows + sharp center pupils)
          f_angry = []
          for dy in [0, 2, 0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy + dy, R, pupil_oy=4)
              draw_eye_with_pupil(d, rx, cy + dy, R, pupil_oy=4)
              d.polygon([(0, 0), (W // 2, cy - 8 + dy), (0, cy - 8 + dy)], fill=BG)
              d.polygon([(W, 0), (W // 2, cy - 8 + dy), (W, cy - 8 + dy)], fill=BG)
              f_angry.append(img)
          save_gif("angry", f_angry, 170)

          # 7. Crying (Looking down + tear drops)
          f_crying = []
          for ty in [10, 25, 45, 65]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy + 8, R - 4, pupil_oy=8, scale_y=0.8)
              draw_eye_with_pupil(d, rx, cy + 8, R - 4, pupil_oy=8, scale_y=0.8)
              d.ellipse([lx - 8, cy + 40 + ty, lx + 8, cy + 56 + ty], fill=WHITE)
              d.ellipse([rx - 8, cy + 40 + ty, rx + 8, cy + 56 + ty], fill=WHITE)
              f_crying.append(img)
          save_gif("crying", f_crying, 130)

          # 8. Loving (Big sparkling eyes with center dots)
          f_loving = []
          for r_mod in [0, 4, 8, 4]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy, R + r_mod, pupil_ox=2, pupil_oy=2)
              draw_eye_with_pupil(d, rx, cy, R + r_mod, pupil_ox=-2, pupil_oy=2)
              f_loving.append(img)
          save_gif("loving", f_loving, 150)

          # 9. Embarrassed (Looking slightly down + blushes)
          f_embarrassed = []
          for sc in [0.8, 0.75, 0.8]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy + 6, R, pupil_oy=6, scale_y=sc)
              draw_eye_with_pupil(d, rx, cy + 6, R, pupil_oy=6, scale_y=sc)
              d.ellipse([lx - 25, cy + 45, lx + 25, cy + 55], fill=WHITE)
              d.ellipse([rx - 25, cy + 45, rx + 25, cy + 55], fill=WHITE)
              f_embarrassed.append(img)
          save_gif("embarrassed", f_embarrassed, 200)

          # 10. Surprised (Bigger eyes + smaller center dot for stunned look)
          f_surprised = []
          for r_mod in [6, 12, 6]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy - 8, R + r_mod)
              draw_eye_with_pupil(d, rx, cy - 8, R + r_mod)
              f_surprised.append(img)
          save_gif("surprised", f_surprised, 140)

          # 11. Shocked
          f_shocked = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy - 14, R + 14)
              draw_eye_with_pupil(d, rx, cy - 14, R + 14)
              f_shocked.append(img)
          save_gif("shocked", f_shocked, 130)

          # 12. Thinking (Both black dots looking up-right together)
          f_thinking = []
          for ox, oy in [(14, -16), (20, -20), (14, -16)]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy, R, pupil_ox=ox, pupil_oy=oy)
              draw_eye_with_pupil(d, rx, cy, R, pupil_ox=ox, pupil_oy=oy)
              f_thinking.append(img)
          save_gif("thinking", f_thinking, 200)

          # 13. Winking (Left open with dot, right cute line)
          f_wink = []
          for i in range(4):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy, R)
              d.rounded_rectangle([rx - R, cy - 5, rx + R, cy + 5], radius=5, fill=WHITE)
              f_wink.append(img)
          save_gif("winking", f_wink, 200)

          # 14. Cool (Squint with pupils)
          f_cool = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy, R, scale_y=0.65)
              draw_eye_with_pupil(d, rx, cy, R, scale_y=0.65)
              f_cool.append(img)
          save_gif("cool", f_cool, 180)

          # 15. Relaxed (Cute closed arcs)
          f_relaxed = []
          for dy in [0, 2, 0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              for cx in [lx, rx]:
                  d.pieslice([cx - R, cy - R + 15 + dy, cx + R, cy + R + 15 + dy], 0, 180, fill=WHITE)
                  d.pieslice([cx - R, cy - R + dy, cx + R, cy + R + dy], 0, 180, fill=BG)
              f_relaxed.append(img)
          save_gif("relaxed", f_relaxed, 220)

          # 16. Delicious (Pupils looking playfully side to side)
          f_delicious = []
          for ox in [-10, 10, -10]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy, R, pupil_ox=ox)
              draw_eye_with_pupil(d, rx, cy, R, pupil_ox=ox)
              f_delicious.append(img)
          save_gif("delicious", f_delicious, 160)

          # 17. Kisses (Gentle squeeze blink)
          f_kisses = []
          for sc in [0.4, 0.3, 0.4]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy, R, scale_y=sc)
              draw_eye_with_pupil(d, rx, cy, R, scale_y=sc)
              f_kisses.append(img)
          save_gif("kisses", f_kisses, 170)

          # 18. Confident (Halka squint with centered pupils)
          f_confident = []
          for dy in [0, -4, 0]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy + dy, R, scale_y=0.85)
              draw_eye_with_pupil(d, rx, cy + dy, R, scale_y=0.85)
              f_confident.append(img)
          save_gif("confident", f_confident, 180)

          # 19. Sleepy (Gentle slit lines)
          f_sleepy = []
          for sc in [0.08, 0.12, 0.08]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              d.rounded_rectangle([lx - R, cy + 10 - 4, lx + R, cy + 10 + 4], radius=4, fill=WHITE)
              d.rounded_rectangle([rx - R, cy + 10 - 4, rx + R, cy + 10 + 4], radius=4, fill=WHITE)
              f_sleepy.append(img)
          save_gif("sleepy", f_sleepy, 250)

          # 20. Silly (One dot looking left, other looking right - cross eyed)
          f_silly = []
          for dy in [4, -4]:
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy - dy, R, pupil_ox=16)
              draw_eye_with_pupil(d, rx, cy + dy, R, pupil_ox=-16)
              f_silly.append(img)
          save_gif("silly", f_silly, 160)

          # 21. Confused (One eye tilted up, one down)
          f_confused = []
          for _ in range(3):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)
              draw_eye_with_pupil(d, lx, cy - 8, R + 4, pupil_oy=-6)
              draw_eye_with_pupil(d, rx, cy + 8, R - 6, pupil_oy=6)
              f_confused.append(img)
          save_gif("confused", f_confused, 190)

          print("Generated 21 cute round eyes with center black dot pupils!")
          EOF

      - name: Commit GIFs To Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gifs/
          git commit -m "Add center black dot pupils to cute round white eyes" || echo "No changes"
          git push

      - name: Upload GIFs ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cute-dot-pupil-emojis
          path: gifs/
