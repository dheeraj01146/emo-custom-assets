name: Build EMO Assets Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download & Setup mklittlefs
        run: |
          wget https://github.com/earlephilhower/mklittlefs/releases/download/3.0.0/x86_64-linux-gnu-mklittlefs-3.0.0.tar.gz
          tar -xzf x86_64-linux-gnu-mklittlefs-3.0.0.tar.gz
          chmod +x mklittlefs

      - name: Build assets.bin
        run: |
          ./mklittlefs -c data -s 0x100000 -p 256 -b 4096 assets.bin

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: assets-bin
          path: assets.bin
